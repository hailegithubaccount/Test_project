version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mern_mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mern_network
    restart: always

  backend:
    build: ./backend
    container_name: mern_backend_api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/song_db
    depends_on:
      - mongo
    networks:
      - mern_network
    restart: always

  frontend:
    build: ./frontend
    container_name: mern_frontend_app
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mern_network
    restart: always

networks:
  mern_network:
    driver: bridge

volumes:
  mongo_data:
